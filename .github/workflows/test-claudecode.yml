name: Offline engine and compatibility tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared test dependencies
        run: python -m pip install ".[claude,test]" "setuptools==84.0.0"
      - name: Prepare test workspace
        run: python -c "from pathlib import Path; Path('.cache').mkdir(exist_ok=True)"
      - name: Offline acceptance suite
        run: python -m pytest -q --basetemp=.cache/pytest-ci
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir .cache/dist
      - name: Isolated installation and import test
        run: python scripts/smoke_package.py .cache/dist/security_review_engine-0.1.0-py3-none-any.whl
  legacy-publisher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979
        with:
          bun-version: '1.3.14'
      - run: bun test
        working-directory: scripts
