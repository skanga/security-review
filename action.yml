name: Security Review Engine
description: Review trusted pull requests using the shared standalone engine
author: Anthropic
inputs:
  model:
    description: Investigation model ID
    default: ''
  validation-model:
    description: Optional independent Claude validation model ID
    default: ''
  backend:
    description: Installed investigation adapter
    default: ''
  config:
    description: Explicit trusted configuration outside the reviewed workspace
    default: ''
  ci-mode:
    description: blocking or advisory; only HIGH findings block the default finding policy
    default: blocking
  timeout-seconds:
    description: End-to-end review deadline in seconds
    default: ''
  claude-api-key:
    description: Anthropic API key for investigation and validation
    required: true
  claude-model:
    description: Deprecated alias for model
    default: ''
  claudecode-timeout:
    description: Deprecated timeout in minutes; conflicts with timeout-seconds are rejected
    default: ''
  comment-pr:
    description: Publish findings and execution summary
    default: 'true'
  upload-results:
    description: Upload canonical report and publication status
    default: 'true'
  exclude-directories:
    description: Comma-separated scope exclusions (not confidentiality controls)
    default: ''
  run-every-commit:
    description: Deprecated; every revision is now reviewed and failures never reserve a PR
    default: 'true'
  custom-security-scan-instructions:
    description: Trusted instruction file outside the reviewed workspace
    default: ''
  false-positive-filtering-instructions:
    description: Trusted validation instruction file outside the reviewed workspace
    default: ''
outputs:
  scan-status:
    description: Canonical execution status
    value: ${{ steps.review.outputs.scan-status }}
  policy-outcome:
    description: pass, fail, or unknown
    value: ${{ steps.review.outputs.policy-outcome }}
  findings-count:
    description: Reportable retained findings
    value: ${{ steps.review.outputs.findings-count }}
  results-file:
    description: Absolute canonical JSON report path in caller workspace
    value: ${{ steps.review.outputs.results-file }}
  publication-status:
    description: published, stale, failed, or not_requested
    value: ${{ steps.review.outputs.publication-status }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - name: Install engine and pinned compatibility runtime
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -I -m pip install "$ACTION_PATH[claude]"
        npm install -g @anthropic-ai/claude-code@2.1.248
    - name: Review using shared engine
      id: review
      shell: bash
      working-directory: ${{ runner.temp }}
      env:
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEW_VALIDATION_MODEL: ${{ inputs.validation-model }}
        REVIEW_BACKEND: ${{ inputs.backend }}
        REVIEW_CONFIG: ${{ inputs.config }}
        REVIEW_CI_MODE: ${{ inputs.ci-mode }}
        REVIEW_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
        REVIEW_COMMENT_PR: ${{ inputs.comment-pr }}
        CLAUDE_MODEL: ${{ inputs.claude-model }}
        CLAUDECODE_TIMEOUT: ${{ inputs.claudecode-timeout }}
        EXCLUDE_DIRECTORIES: ${{ inputs.exclude-directories }}
        CUSTOM_SECURITY_SCAN_INSTRUCTIONS: ${{ inputs.custom-security-scan-instructions }}
        FALSE_POSITIVE_FILTERING_INSTRUCTIONS: ${{ inputs.false-positive-filtering-instructions }}
        ANTHROPIC_API_KEY: ${{ inputs.claude-api-key }}
        GITHUB_SOURCE_TOKEN: ${{ github.token }}
        GITHUB_PUBLISH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: python -I -m security_review.action
    - name: Upload canonical results
      if: always() && inputs.upload-results == 'true'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: security-review-results
        path: |
          ${{ github.workspace }}/security-review-results.json
          ${{ github.workspace }}/security-review-publication.json
        retention-days: 7
        if-no-files-found: warn
branding:
  icon: shield
  color: red
