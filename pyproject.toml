[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-review-engine"
version = "0.1.0"
description = "Standalone agentic security review engine (initial M1 implementation)"
requires-python = ">=3.11,<3.15"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
claude = ["requests==2.34.2", "anthropic==0.75.0"]
test = ["pytest>=7"]

[project.scripts]
security-review = "security_review.__main__:main"

[tool.setuptools.packages.find]
include = ["security_review*", "claudecode*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
security_review = ["schemas/*.json", "profiles/*.json"]
